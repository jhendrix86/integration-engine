version: '3.8'

services:
  integration-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: integration-engine
    ports:
      - "8044:8044"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/integrations
      - REDIS_URL=redis://redis:6379
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-100}
      - RATE_LIMIT_PER_HOUR=${RATE_LIMIT_PER_HOUR:-1000}
      - WEBHOOK_TIMEOUT=${WEBHOOK_TIMEOUT:-30}
      - SYNC_BATCH_SIZE=${SYNC_BATCH_SIZE:-100}
      - SYNC_RETRY_ATTEMPTS=${SYNC_RETRY_ATTEMPTS:-3}
      - DEBUG=${DEBUG:-false}
      - GLOBAL_STATE_MANAGER_URL=http://global-state-manager:8035
    depends_on:
      - postgres
      - redis
    networks:
      - integration-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: integration-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=integrations
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - integration-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: integration-redis
    networks:
      - integration-network
    restart: unless-stopped

networks:
  integration-network:
    driver: bridge

volumes:
  postgres-data:
