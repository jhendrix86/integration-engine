version: '3.8'

services:
  integration-engine:
    build:
      # Workspace root, not just this repo - needed to reach the
      # empire-operators sibling package the Dockerfile copies in (see its
      # own comment for why; content-engine is the reference impl). This
      # context path is relative to this compose file's own location, so
      # `docker compose -f docker/docker-compose.yml build` from
      # integration-engine/ still works unchanged.
      context: ../..
      dockerfile: integration-engine/docker/Dockerfile
    container_name: integration-engine
    ports:
      - "8044:8044"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/integrations
      - REDIS_URL=redis://redis:6379/3
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-100}
      - RATE_LIMIT_PER_HOUR=${RATE_LIMIT_PER_HOUR:-1000}
      - WEBHOOK_TIMEOUT=${WEBHOOK_TIMEOUT:-30}
      - SYNC_BATCH_SIZE=${SYNC_BATCH_SIZE:-100}
      - SYNC_RETRY_ATTEMPTS=${SYNC_RETRY_ATTEMPTS:-3}
      - DEBUG=${DEBUG:-false}
      - GLOBAL_STATE_MANAGER_URL=http://global-state-manager:8035
    # No depends_on here - postgres/redis moved to shared infra
    # (deploy/docker-compose.infra.yml), a different compose project.
    # Bring that up first: deploy/03-build-and-up.sh infra-up
    networks:
      - os42-shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8044/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  os42-shared:
    external: true
