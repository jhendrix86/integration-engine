version: '3.8'

services:
  integration-engine:
    build: .
    container_name: integration-engine
    ports:
      - "8040:8040"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/integration}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DEBUG=${DEBUG:-false}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app
    networks:
      - os42

  postgres:
    image: postgres:15-alpine
    container_name: integration-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=integration
    volumes:
      - integration-postgres-data:/var/lib/postgresql/data
    networks:
      - os42

  redis:
    image: redis:7-alpine
    container_name: integration-redis
    networks:
      - os42

volumes:
  integration-postgres-data:

networks:
  os42:
    driver: bridge
